# Offline-Tests auf GitHub: ohne Microsoft Access, ohne te.comp und OHNE KI-Anfragen (der echte HTTP-Transport ist in
# tests/conftest.py gesperrt, solange WIDS_LIVE_AI nicht gesetzt ist). Access-/GUI-/Live-Tests laufen nur lokal.
name: Offline-Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Abhängigkeiten installieren
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check app tests scripts build.py
      - name: Mypy
        run: python -m mypy app
      - name: Pytest (ohne Access, GUI, te.comp und Live-KI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m "not access and not access_app and not gui and not live_ai and not tecomp and not live_tecomp"
